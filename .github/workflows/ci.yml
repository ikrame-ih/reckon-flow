name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: reckonflow
          POSTGRES_PASSWORD: reckonflow
          POSTGRES_DB: reckonflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U reckonflow"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://reckonflow:reckonflow@localhost:5432/reckonflow
      API_KEY: ""
      RATE_LIMIT_ENABLED: "false"
      METRICS_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Apply migrations
        run: uv run alembic upgrade head

      - name: Ruff check
        run: uv run ruff check src tests

      - name: Ruff format check
        run: uv run ruff format --check src tests

      - name: Type check
        run: uv run mypy src

      - name: Tests with coverage
        run: uv run pytest --cov=reckonflow --cov-report=term-missing --cov-fail-under=80

      - name: Dependency audit
        run: uv run pip-audit

      - name: Receipt evals
        run: uv run python scripts/run_evals.py

      - name: Docs build
        run: uv run mkdocs build --strict
