# Render web service definition
# Dashboard alternative: create a Web Service manually with the same settings

services:
  - type: web
    name: reckonflow-api
    runtime: python
    plan: free
    region: frankfurt
    branch: main
    buildCommand: pip install uv && uv sync --frozen
    startCommand: bash scripts/render_start.sh
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: "false"
      - key: IDEMPOTENCY_ENABLED
        value: "true"
      - key: REDIS_KEY_PREFIX
        value: "reckonflow:"
      - key: RECEIPT_STORAGE_DIR
        value: /tmp/reckonflow-receipts
      # Secrets from the dashboard:
      # DATABASE_URL — Neon (postgresql+asyncpg://…?ssl=require)
      # REDIS_URL    — Upstash (rediss://…, note the double s)
      # API_KEY      — required on mutating routes in production
      # GROQ_API_KEY — optional
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
