[project]
name = "reckonflow"
version = "0.1.0"
description = "Headless financial reconciliation engine for corporate travel expenses"
readme = "README.md"
authors = [
    { name = "Ikrame Ibn Hayoun", email = "ikihga2223@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic-settings>=2.6.0",
    "structlog>=24.4.0",
    "sqlalchemy>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.18.5",
    "redis>=8.1.0",
    "tenacity>=9.1.4",
    "rapidfuzz>=3.14.5",
    "pgvector>=0.3",
    "python-multipart>=0.0.32",
    "pydantic-ai>=0.0.50",
    "httpx>=0.28.1",
    "groq>=1.6.0",
    "prometheus-fastapi-instrumentator>=8.1.0",
    "scalar-fastapi>=1.0.0",
]

[project.scripts]
reckonflow = "reckonflow.main:run"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.28.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "pre-commit>=4.0.0",
    "aiosqlite>=0.22.1",
    "mkdocs-material>=9.7.7",
    "pip-audit>=2.10.1",
    "pytest-cov>=7.1.0",
]

[tool.uv]
default-groups = ["dev"]

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency markers are meant to sit in argument defaults, so B008
# ("no function calls in defaults") is a false positive for them
extend-immutable-calls = [
    "fastapi.Body",
    "fastapi.Depends",
    "fastapi.File",
    "fastapi.Form",
    "fastapi.Header",
    "fastapi.Path",
    "fastapi.Query",
]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
packages = ["reckonflow"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "postgres: requires a live PostgreSQL (DATABASE_URL postgresql+asyncpg://…)",
]
