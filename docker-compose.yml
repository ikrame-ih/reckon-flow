services:
  db:
    image: pgvector/pgvector:pg16
    container_name: reckonflow-db
    environment:
      POSTGRES_USER: reckonflow
      POSTGRES_PASSWORD: reckonflow
      POSTGRES_DB: reckonflow
    ports:
      - "5432:5432"
    volumes:
      - reckonflow_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reckonflow -d reckonflow"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: reckonflow-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  reckonflow_pgdata:
